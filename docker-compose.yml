services:
  db:
    image: postgres:15-alpine
    container_name: activation-db
    environment:
      POSTGRES_DB: activation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: activation-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/activation_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      PROVIDER_URL: http://provider-mock:8081
    depends_on:
      - db

  provider-mock:
    image: rodolpheche/wiremock:latest
    container_name: provider-mock
    ports:
      - "8081:8080"
